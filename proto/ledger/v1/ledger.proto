syntax = "proto3";

package ledger.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service LedgerService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc PostJournal(PostJournalRequest) returns (PostJournalResponse);
  rpc ExecuteFlow(ExecuteFlowRequest) returns (ExecuteFlowResponse);
  rpc GetFlow(GetFlowRequest) returns (GetFlowResponse);
  rpc ListAccountActivity(ListAccountActivityRequest) returns (ListAccountActivityResponse);
  rpc TakeBalanceSnapshot(TakeBalanceSnapshotRequest) returns (TakeBalanceSnapshotResponse);
  rpc CreateReservation(CreateReservationRequest) returns (CreateReservationResponse);
  rpc CommitReservation(CommitReservationRequest) returns (CommitReservationResponse);
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
  rpc GetReservation(GetReservationRequest) returns (GetReservationResponse);
  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse);
  rpc ExecuteExchange(ExecuteExchangeRequest) returns (ExecuteExchangeResponse);
  rpc PutFXRate(PutFXRateRequest) returns (PutFXRateResponse);
  rpc GetFXRate(GetFXRateRequest) returns (GetFXRateResponse);
  rpc ListFXRates(ListFXRatesRequest) returns (ListFXRatesResponse);
  rpc IngestExternalRecords(IngestExternalRecordsRequest) returns (IngestExternalRecordsResponse);
  rpc RunReconciliation(RunReconciliationRequest) returns (RunReconciliationResponse);
  rpc GetReconciliationBatch(GetReconciliationBatchRequest) returns (GetReconciliationBatchResponse);
  rpc ListDiscrepancies(ListDiscrepanciesRequest) returns (ListDiscrepanciesResponse);
  rpc ResolveDiscrepancy(ResolveDiscrepancyRequest) returns (ResolveDiscrepancyResponse);
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_DEBIT = 1;
  DIRECTION_CREDIT = 2;
}

enum NormalBalance {
  NORMAL_BALANCE_UNSPECIFIED = 0;
  NORMAL_BALANCE_DEBIT = 1;
  NORMAL_BALANCE_CREDIT = 2;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_FROZEN = 2;
  ACCOUNT_STATUS_CLOSED = 3;
}

enum FlowStatus {
  FLOW_STATUS_UNSPECIFIED = 0;
  FLOW_STATUS_RUNNING = 1;
  FLOW_STATUS_COMPLETED = 2;
  FLOW_STATUS_FAILED = 3;
}

message Entry {
  string account_id = 1 [(buf.validate.field).string.min_len = 1];
  string currency   = 2 [(buf.validate.field).string.min_len = 3];
  Direction direction = 3 [(buf.validate.field).enum.defined_only = true];
  string amount     = 4 [(buf.validate.field).string.pattern = "^[0-9]+(\\.[0-9]+)?$"];
}

message Journal {
  string event_id        = 1 [(buf.validate.field).string.min_len = 1];
  string source_service  = 2;
  string source_type     = 3;
  string actor_id        = 4;
  google.protobuf.Struct metadata = 5;
  repeated Entry entries = 6 [(buf.validate.field).repeated.min_items = 1];
}

message Account {
  string id              = 1;
  string tenant_id       = 2;
  string owner_type      = 3;
  string owner_id        = 4;
  string account_type    = 5;
  string currency        = 6;
  NormalBalance normal_balance = 7;
  bool   allow_negative  = 8;
  AccountStatus status   = 9;
  google.protobuf.Timestamp created_at = 10;
}

message Balance {
  string account_id      = 1;
  string currency        = 2;
  string posted_debits   = 3;
  string posted_credits  = 4;
  string normalized      = 5;
  int64  version         = 6;
}

message CreateAccountRequest {
  string tenant_id       = 1 [(buf.validate.field).string.min_len = 1];
  string owner_type      = 2 [(buf.validate.field).string.min_len = 1];
  string owner_id        = 3 [(buf.validate.field).string.min_len = 1];
  string account_type    = 4 [(buf.validate.field).string.min_len = 1];
  string currency        = 5 [(buf.validate.field).string.min_len = 3];
  NormalBalance normal_balance = 6 [(buf.validate.field).enum.defined_only = true];
  bool   allow_negative  = 7;
}
message CreateAccountResponse { Account account = 1; }

message GetAccountRequest  { string tenant_id = 1; string account_id = 2; }
message GetAccountResponse { Account account = 1; }

message GetBalanceRequest {
  string tenant_id  = 1;
  string account_id = 2;
  string currency   = 3;
  google.protobuf.Timestamp as_of = 4;
}
message GetBalanceResponse { Balance balance = 1; }

message PostJournalRequest {
  string tenant_id        = 1 [(buf.validate.field).string.min_len = 1];
  string idempotency_key  = 2 [(buf.validate.field).string.min_len = 1];
  string source_service   = 3;
  string actor_id         = 4;
  Journal journal         = 5;
}
message PostJournalResponse {
  string journal_id = 1;
  string flow_run_id = 2;
}

message Step {
  string step_id = 1 [(buf.validate.field).string.min_len = 1];
  Journal journal = 2;
}

message ExecuteFlowRequest {
  string tenant_id       = 1 [(buf.validate.field).string.min_len = 1];
  string flow_type       = 2 [(buf.validate.field).string.min_len = 1];
  string idempotency_key = 3 [(buf.validate.field).string.min_len = 1];
  string source_service  = 4;
  string actor_id        = 5;
  repeated Step steps    = 6 [(buf.validate.field).repeated.min_items = 1];
  google.protobuf.Struct metadata = 7;
}

message FlowStepResult {
  string step_id    = 1;
  string status     = 2;
  string journal_id = 3;
  string error_code = 4;
}

message ExecuteFlowResponse {
  string flow_run_id = 1;
  FlowStatus status  = 2;
  repeated FlowStepResult steps = 3;
}

message GetFlowRequest  { string tenant_id = 1; string flow_run_id = 2; }
message GetFlowResponse { ExecuteFlowResponse flow = 1; }

message ListAccountActivityRequest {
  string tenant_id  = 1;
  string account_id = 2;
  string currency   = 3;
  google.protobuf.Timestamp since = 4;
  google.protobuf.Timestamp until = 5;
  int32  page_size  = 6;
  string page_token = 7;
}
message AccountActivityEntry {
  string journal_id = 1;
  string entry_id   = 2;
  string currency   = 3;
  Direction direction = 4;
  string amount     = 5;
  google.protobuf.Timestamp created_at = 6;
  string source_service = 7;
}
message ListAccountActivityResponse {
  repeated AccountActivityEntry entries = 1;
  string next_page_token = 2;
}

message TakeBalanceSnapshotRequest {
  string tenant_id  = 1 [(buf.validate.field).string.min_len = 1];
  // If account_id+currency are set, snapshot one row. Otherwise snapshot
  // every account_balances row in the tenant.
  string account_id = 2;
  string currency   = 3;
}
message TakeBalanceSnapshotResponse {
  int32 snapshots_taken = 1;
}

message Reservation {
  string id                       = 1;
  string tenant_id                = 2;
  string status                   = 3;
  string source_account_id        = 4;
  string reserved_account_id      = 5;
  string currency                 = 6;
  string original_amount          = 7;
  string outstanding_amount       = 8;
  string committed_amount         = 9;
  string released_amount          = 10;
  google.protobuf.Timestamp expires_at = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  string flow_run_id              = 14;
}

message CreateReservationRequest {
  string tenant_id            = 1 [(buf.validate.field).string.min_len = 1];
  string idempotency_key      = 2 [(buf.validate.field).string.min_len = 1];
  string source_account_id    = 3 [(buf.validate.field).string.min_len = 1];
  string reserved_account_id  = 4 [(buf.validate.field).string.min_len = 1];
  string currency             = 5 [(buf.validate.field).string.min_len = 3];
  string amount               = 6 [(buf.validate.field).string.pattern = "^[0-9]+(\\.[0-9]+)?$"];
  google.protobuf.Timestamp expires_at = 7;
  string source_service       = 8;
  string actor_id             = 9;
  google.protobuf.Struct metadata = 10;
}
message CreateReservationResponse { Reservation reservation = 1; }

message CommitReservationRequest {
  string tenant_id              = 1;
  string reservation_id         = 2;
  string destination_account_id = 3;
  string amount                 = 4;
  string idempotency_key        = 5;
  string source_service         = 6;
  string actor_id               = 7;
}
message CommitReservationResponse { Reservation reservation = 1; }

message ReleaseReservationRequest {
  string tenant_id       = 1;
  string reservation_id  = 2;
  string amount          = 3;
  string idempotency_key = 4;
  string source_service  = 5;
  string actor_id        = 6;
}
message ReleaseReservationResponse { Reservation reservation = 1; }

message GetReservationRequest  { string tenant_id = 1; string reservation_id = 2; }
message GetReservationResponse { Reservation reservation = 1; }

message ListReservationsRequest {
  string tenant_id  = 1 [(buf.validate.field).string.min_len = 1];
  string owner_type = 2;                   // optional filter (e.g. "user")
  string owner_id   = 3;                   // optional filter
  string status     = 4;                   // optional: HELD|PARTIAL|COMMITTED|RELEASED|EXPIRED
  int32  page_size  = 5;                   // 1..500; 0 → 100
}
message ListReservationsResponse {
  repeated Reservation reservations = 1;
}

message FXRate {
  string id              = 1;
  string tenant_id       = 2;
  string base_currency   = 3;
  string quote_currency  = 4;
  string rate            = 5;
  string source          = 6;
  google.protobuf.Timestamp effective_at = 7;
  google.protobuf.Timestamp created_at   = 8;
}

message ExecuteExchangeRequest {
  string tenant_id                  = 1 [(buf.validate.field).string.min_len = 1];
  string idempotency_key            = 2 [(buf.validate.field).string.min_len = 1];
  string from_account_id            = 3 [(buf.validate.field).string.min_len = 1];
  string to_account_id              = 4 [(buf.validate.field).string.min_len = 1];
  string from_counter_account_id    = 5 [(buf.validate.field).string.min_len = 1];
  string to_counter_account_id      = 6 [(buf.validate.field).string.min_len = 1];
  string from_amount                = 7 [(buf.validate.field).string.pattern = "^[0-9]+(\\.[0-9]+)?$"];
  string to_amount                  = 8 [(buf.validate.field).string.pattern = "^[0-9]+(\\.[0-9]+)?$"];
  string rate                       = 9;
  string rate_source                = 10;
  string source_service             = 11;
  string actor_id                   = 12;
  google.protobuf.Struct metadata   = 13;
}
message ExecuteExchangeResponse {
  string flow_run_id = 1;
  string journal_id  = 2;
  string rate_used   = 3;
  string rate_source = 4;
}

message PutFXRateRequest {
  string tenant_id       = 1 [(buf.validate.field).string.min_len = 1];
  string base_currency   = 2 [(buf.validate.field).string.min_len = 3];
  string quote_currency  = 3 [(buf.validate.field).string.min_len = 3];
  string rate            = 4 [(buf.validate.field).string.pattern = "^[0-9]+(\\.[0-9]+)?$"];
  string source          = 5 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp effective_at = 6;
}
message PutFXRateResponse { FXRate rate = 1; }

message GetFXRateRequest {
  string tenant_id      = 1;
  string base_currency  = 2;
  string quote_currency = 3;
  google.protobuf.Timestamp at = 4;
}
message GetFXRateResponse { FXRate rate = 1; }

message ListFXRatesRequest {
  string tenant_id      = 1;
  string base_currency  = 2;
  string quote_currency = 3;
  google.protobuf.Timestamp since = 4;
  google.protobuf.Timestamp until = 5;
  int32  page_size      = 6;
}
message ListFXRatesResponse { repeated FXRate rates = 1; }

message ExternalRecord {
  string id              = 1;
  string tenant_id       = 2;
  string source          = 3;
  string external_ref    = 4;
  string amount          = 5;
  string currency        = 6;
  google.protobuf.Timestamp occurred_at = 7;
  string account_id      = 8;
  google.protobuf.Struct raw_payload = 9;
  string match_status    = 10;
  string matched_journal_id = 11;
  google.protobuf.Timestamp created_at = 12;
}

message ExternalRecordInput {
  string source          = 1 [(buf.validate.field).string.min_len = 1];
  string external_ref    = 2 [(buf.validate.field).string.min_len = 1];
  string amount          = 3 [(buf.validate.field).string.pattern = "^[0-9]+(\\.[0-9]+)?$"];
  string currency        = 4 [(buf.validate.field).string.min_len = 3];
  google.protobuf.Timestamp occurred_at = 5;
  string account_id      = 6;
  google.protobuf.Struct raw_payload = 7;
}

message IngestExternalRecordsRequest {
  string tenant_id                       = 1 [(buf.validate.field).string.min_len = 1];
  repeated ExternalRecordInput records   = 2 [(buf.validate.field).repeated.min_items = 1];
}
message IngestExternalRecordsResponse {
  int32 inserted = 1;
  int32 skipped  = 2;
}

message RunReconciliationRequest {
  string tenant_id       = 1 [(buf.validate.field).string.min_len = 1];
  string idempotency_key = 2 [(buf.validate.field).string.min_len = 1];
  string source          = 3 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp window_start = 4;
  google.protobuf.Timestamp window_end   = 5;
  string actor_id        = 6;
}

message ReconciliationBatch {
  string id              = 1;
  string tenant_id       = 2;
  string source          = 3;
  google.protobuf.Timestamp window_start = 4;
  google.protobuf.Timestamp window_end   = 5;
  string status          = 6;
  int32  ingested_count  = 7;
  int32  matched_count   = 8;
  int32  mismatched_count = 9;
  int32  missing_in_ledger_count   = 10;
  int32  missing_in_external_count = 11;
  google.protobuf.Timestamp started_at   = 12;
  google.protobuf.Timestamp completed_at = 13;
  string actor_id        = 14;
}
message RunReconciliationResponse { ReconciliationBatch batch = 1; }

message GetReconciliationBatchRequest  { string tenant_id = 1; string batch_id = 2; }
message GetReconciliationBatchResponse { ReconciliationBatch batch = 1; }

message Discrepancy {
  string id                       = 1;
  string tenant_id                = 2;
  string batch_id                 = 3;
  string type                     = 4;
  string external_record_id       = 5;
  string journal_id               = 6;
  string status                   = 7;
  string resolution_journal_id    = 8;
  string resolution_note          = 9;
  string resolved_by              = 10;
  google.protobuf.Timestamp resolved_at = 11;
  google.protobuf.Timestamp created_at  = 12;
}

message ListDiscrepanciesRequest {
  string tenant_id  = 1;
  string batch_id   = 2;
  string status     = 3;
  int32  page_size  = 4;
}
message ListDiscrepanciesResponse {
  repeated Discrepancy discrepancies = 1;
}

message ResolveDiscrepancyRequest {
  string tenant_id              = 1 [(buf.validate.field).string.min_len = 1];
  string discrepancy_id         = 2 [(buf.validate.field).string.min_len = 1];
  string resolution             = 3 [(buf.validate.field).string.min_len = 1];
  ExecuteFlowRequest adjustment = 4;
  string note                   = 5;
  string idempotency_key        = 6 [(buf.validate.field).string.min_len = 1];
  string actor_id               = 7;
}
message ResolveDiscrepancyResponse { Discrepancy discrepancy = 1; }
