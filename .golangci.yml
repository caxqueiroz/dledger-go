version: "2"

run:
  go: "1.26"
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true
        - name: unreachable-code
        - name: redefines-builtin-id
    staticcheck:
      checks:
        - all
        # SA1029 is incompatible with our tenant context-key idiom
        - -SA1029
        # ST1000 (package comments) - too noisy for an MVP
        - -ST1000
    gosec:
      excludes:
        - G104 # Many json.Marshal errors intentionally ignored on best-effort paths
        - G115 # sqlc/proto produce inevitable int<->int32 conversions
        - G404 # math/rand/v2 jitter is fine for backoff; not crypto
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Conn).Close
        - (*database/sql.Rows).Close
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Close

  exclusions:
    rules:
      # Generated code is exempt from everything we care about.
      - path: ^gen/
        linters:
          - errcheck
          - gosec
          - govet
          - revive
          - staticcheck
          - unused
      # Test files can have looser rules.
      - path: _test\.go$
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/caxqueiroz/dledger-go
